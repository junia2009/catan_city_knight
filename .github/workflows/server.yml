name: Deploy game server (Cloudflare)

# オンライン対戦サーバーを Cloudflare Workers へデプロイする。
# ルールエンジン(src/)はサーバーも同じコードを取り込むため、
# ルールを変更したときも再デプロイが必要 → paths に src/ を含めている。
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'wrangler.toml'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 部屋のロジックを含む全テストを通してからデプロイする
      - run: npm ci
      - run: npm test

      # アカウントIDは貼り間違い(空白混入・ゾーンIDと取り違え)が起きやすいので、
      # 形を検査して、怪しければ空にしてトークンからの自動判定に任せる。
      - name: アカウントIDを検査
        id: acct
        env:
          RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          if [ -z "$ID" ]; then
            echo "アカウントID未設定 → トークンから自動判定します"
            echo "id=" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "アカウントIDの形式は正しいです(32桁の16進数)"
            echo "id=$ID" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_ACCOUNT_ID の形式が不正です(長さ ${#ID} 文字)。32桁の 0-9a-f である必要があります。今回は自動判定に切り替えます"
            echo "id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.acct.outputs.id }}

      # 実際に動いているかを確認する(壊れたデプロイをここで止める)
      - name: デプロイ後の疎通確認
        env:
          DEPLOYED: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          BASE="${DEPLOYED:-https://catan-web-server.uri-ryohei-0427.workers.dev}"
          BASE="${BASE%/}"
          echo "確認先: $BASE"

          # 反映に数秒かかることがあるので待ちながら試す
          OK=""
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "$BASE/health" 2>/dev/null | grep -q '"ok":true'; then
              OK=1; break
            fi
            echo "  応答待ち ($i/6)…"; sleep 5
          done
          if [ -z "$OK" ]; then
            echo "::error::/health が応答しません($BASE)"
            exit 1
          fi
          echo "✅ /health 応答あり"

          # 部屋が作れるか(合言葉の発行 = Durable Object が動いている証拠)
          CODE=$(curl -fsS --max-time 20 -X POST "$BASE/new" | sed -n 's/.*"code":"\([A-Z]*\)".*/\1/p')
          if ! echo "$CODE" | grep -qE '^[A-Z]{4}$'; then
            echo "::error::部屋を作成できませんでした(Durable Object の設定を確認してください)"
            exit 1
          fi
          echo "✅ 部屋の作成に成功(合言葉: $CODE)"

          {
            echo "### ✅ オンライン対戦サーバー稼働中"
            echo ''
            echo "| 項目 | 結果 |"
            echo "|---|---|"
            echo "| 接続先 | \`$BASE\` |"
            echo "| /health | 応答あり |"
            echo "| 部屋の作成 | 成功(合言葉 \`$CODE\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # タイトル画面に版を刻む(端末が最新版を掴んでいるか目視で分かるように)
      - name: 版を埋め込む
        run: |
          BUILD="$(git rev-parse --short HEAD) $(date -u +%m/%d\ %H:%M)"
          sed -i "s|ver. BUILD_ID|ver. ${BUILD} UTC|" index.html
          grep -o 'id="build-tag">[^<]*' index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      # 配信された実物を確認する。版が置換されないまま公開されると
      # 「どの版が動いているか」が分からなくなり、不具合の切り分けができなくなる。
      - name: 配信された版を確認
        run: |
          URL="${{ steps.deployment.outputs.page_url }}index.html"
          echo "確認先: $URL"
          for i in 1 2 3 4 5 6; do
            TAG=$(curl -fsS --max-time 15 "$URL?_=$(date +%s)" 2>/dev/null \
                  | grep -o 'id="build-tag">[^<]*' | head -1 || true)
            echo "  ($i) ${TAG:-取得できず}"
            case "$TAG" in
              *BUILD_ID*) sleep 10 ;;
              '') sleep 10 ;;
              *) echo "✅ 版が正しく埋め込まれています"; exit 0 ;;
            esac
          done
          echo "::error::配信された index.html の版が BUILD_ID のままです"
          exit 1
